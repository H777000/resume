<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>:root{--paper:#faf7ec;--ink:#163e35;--accent:#b98742;--panel:#e7ecd9}*{box-sizing:border-box}body{margin:0}.ppt-slide{position:relative;overflow:hidden;width:1280px;height:720px;color:var(--ink);background:var(--paper);font-family:'PingFang SC','Microsoft YaHei',sans-serif}.text{position:relative;z-index:1;padding:68px}.cover .text{max-width:82%;top:110px}h1{font-size:85px;line-height:1.15;margin:0 0 34px;letter-spacing:-3px}.lead{font-size:32px;line-height:1.5;margin:0}.body h1{font-size:60px}.body .points{display:grid;gap:18px;margin-top:44px}.body .point{padding:15px 24px;border-left:6px solid var(--accent);font-size:32px;background:var(--panel)}.art{position:absolute;inset:0;pointer-events:none}.art i{position:absolute;display:block}.cover .text{max-width:66%;top:120px}.art{left:65%;background:#163e35;overflow:hidden}.art i{border:3px solid #c4d68c;width:560px;height:560px;border-radius:50%;left:-10%;top:34%}.art i:nth-child(2){left:0;top:40%}.art i:nth-child(3){left:10%;top:46%}.body .art{left:84%}.body .text{width:84%}.body .points{gap:8px}.body .point{border:0;border-bottom:2px solid #9daa83;background:transparent}</style><main class="ppt-slide body"><div class="art" aria-hidden="true"><i></i><i></i><i></i></div><section class="text"><h1>{{title}}</h1><div class="points"><div class="point">{{point1}}</div><div class="point">{{point2}}</div><div class="point">{{point3}}</div></div></section></main></html>
