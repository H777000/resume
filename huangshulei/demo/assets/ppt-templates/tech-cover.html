<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>:root{--paper:#201a46;--ink:#f4f2fc;--accent:#91e4c1;--panel:#352d62}*{box-sizing:border-box}body{margin:0}.ppt-slide{position:relative;overflow:hidden;width:1280px;height:720px;color:var(--ink);background:var(--paper);font-family:'PingFang SC','Microsoft YaHei',sans-serif}.text{position:relative;z-index:1;padding:68px}.cover .text{max-width:82%;top:110px}h1{font-size:85px;line-height:1.15;margin:0 0 34px;letter-spacing:-3px}.lead{font-size:32px;line-height:1.5;margin:0}.body h1{font-size:60px}.body .points{display:grid;gap:18px;margin-top:44px}.body .point{padding:15px 24px;border-left:6px solid var(--accent);font-size:32px;background:var(--panel)}.art{position:absolute;inset:0;pointer-events:none}.art i{position:absolute;display:block}.art i{width:335px;height:335px;right:6%;top:15%;transform:rotate(36deg);border:26px solid #7c5cfc}.art i:nth-child(2){top:27%;right:11%;border-color:#91e4c1}.art i:nth-child(3){top:39%;right:16%;border-color:#514587}.cover .text{max-width:68%;top:128px}.lead{color:#91e4c1}.body .art{transform:translate(190px,100px) scale(.8)}.body .text{max-width:77%}.body .point{border-radius:14px}</style><main class="ppt-slide cover"><div class="art" aria-hidden="true"><i></i><i></i><i></i></div><section class="text"><h1>{{title}}</h1><p class="lead">{{lead}}</p></section></main></html>
