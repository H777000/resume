<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>:root{--paper:#142d4e;--ink:#faf7f1;--accent:#da8443;--panel:#233e60}*{box-sizing:border-box}body{margin:0}.ppt-slide{position:relative;overflow:hidden;width:1280px;height:720px;color:var(--ink);background:var(--paper);font-family:'PingFang SC','Microsoft YaHei',sans-serif}.text{position:relative;z-index:1;padding:68px}.cover .text{max-width:82%;top:110px}h1{font-size:85px;line-height:1.15;margin:0 0 34px;letter-spacing:-3px}.lead{font-size:32px;line-height:1.5;margin:0}.body h1{font-size:60px}.body .points{display:grid;gap:18px;margin-top:44px}.body .point{padding:15px 24px;border-left:6px solid var(--accent);font-size:32px;background:var(--panel)}.art{position:absolute;inset:0;pointer-events:none}.art i{position:absolute;display:block}.cover .text{max-width:74%;top:140px}.art i{background:#da8443;width:155px;height:700px;right:-40px;bottom:-200px;transform:skew(-23deg)}.art i:nth-child(2){right:106px;background:#375172}.art i:nth-child(3){right:248px;background:#233d5e}.body .art{opacity:.28}.body .points{grid-template-columns:1fr 1fr 1fr}.body .point{border:0;border-top:6px solid var(--accent);min-height:180px}</style><main class="ppt-slide body"><div class="art" aria-hidden="true"><i></i><i></i><i></i></div><section class="text"><h1>{{title}}</h1><div class="points"><div class="point">{{point1}}</div><div class="point">{{point2}}</div><div class="point">{{point3}}</div></div></section></main></html>
