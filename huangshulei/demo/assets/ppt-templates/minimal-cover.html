<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>:root{--paper:#fafafa;--ink:#202020;--accent:#202020;--panel:#ededed}*{box-sizing:border-box}body{margin:0}.ppt-slide{position:relative;overflow:hidden;width:1280px;height:720px;color:var(--ink);background:var(--paper);font-family:'PingFang SC','Microsoft YaHei',sans-serif}.text{position:relative;z-index:1;padding:68px}.cover .text{max-width:82%;top:110px}h1{font-size:85px;line-height:1.15;margin:0 0 34px;letter-spacing:-3px}.lead{font-size:32px;line-height:1.5;margin:0}.body h1{font-size:60px}.body .points{display:grid;gap:18px;margin-top:44px}.body .point{padding:15px 24px;border-left:6px solid var(--accent);font-size:32px;background:var(--panel)}.art{position:absolute;inset:0;pointer-events:none}.art i{position:absolute;display:block}.art{border:24px solid #202020}.cover .text{top:145px;max-width:92%}.cover h1{font-weight:900;font-size:104px;letter-spacing:-6px}.lead{border-top:3px solid #202020;padding-top:24px}.body .text{padding:72px}.body .point{background:transparent;border:0;border-bottom:2px solid #202020;padding-left:0}</style><main class="ppt-slide cover"><div class="art" aria-hidden="true"><i></i><i></i><i></i></div><section class="text"><h1>{{title}}</h1><p class="lead">{{lead}}</p></section></main></html>
