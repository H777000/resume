<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>:root{--paper:#f7f5f0;--ink:#243347;--accent:#b35436;--panel:#ede7db}*{box-sizing:border-box}body{margin:0}.ppt-slide{position:relative;overflow:hidden;width:1280px;height:720px;color:var(--ink);background:var(--paper);font-family:'PingFang SC','Microsoft YaHei',sans-serif}.text{position:relative;z-index:1;padding:68px}.cover .text{max-width:82%;top:110px}h1{font-size:85px;line-height:1.15;margin:0 0 34px;letter-spacing:-3px}.lead{font-size:32px;line-height:1.5;margin:0}.body h1{font-size:60px}.body .points{display:grid;gap:18px;margin-top:44px}.body .point{padding:15px 24px;border-left:6px solid var(--accent);font-size:32px;background:var(--panel)}.art{position:absolute;inset:0;pointer-events:none}.art i{position:absolute;display:block}.cover .text{max-width:77%;border-left:12px solid var(--accent);margin-left:64px;padding-left:44px}h1{font-family:'Songti SC',Georgia,serif}.art i{width:460px;height:590px;right:-186px;bottom:-255px;border:2px solid #b35436;transform:rotate(-31deg)}.art i:nth-child(2){right:-163px}.art i:nth-child(3){right:-140px}.body .text{width:90%}</style><main class="ppt-slide cover"><div class="art" aria-hidden="true"><i></i><i></i><i></i></div><section class="text"><h1>{{title}}</h1><p class="lead">{{lead}}</p></section></main></html>
